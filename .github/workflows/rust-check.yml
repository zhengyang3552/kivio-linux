# Rust/Tauri 侧门禁:仅在 src-tauri 变更时触发,cargo test 作门禁
# (完整 tauri build 仍在本地/发布流程)。
name: Rust

on:
  push:
    branches: [main]
    # 工作流文件自身也在触发面里:改工作流(如桩步骤)能立即自测,
    # 否则要等下一次 src-tauri 变更才暴露问题。
    paths: ['src-tauri/**', '.github/workflows/rust-check.yml']
  pull_request:
    branches: [main]
    paths: ['src-tauri/**', '.github/workflows/rust-check.yml']

jobs:
  cargo-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri-build 的 build.rs 会校验 externalBin sidecar 与 frontendDist 存在性,
      # cargo test 不需要真产物,放空壳即可。
      # (kivio-ocr-helper 真实实现仅 macOS,Linux 下为空 stub,运行时按平台禁用)
      - name: Stub sidecar binary and frontend dist
        run: |
          mkdir -p dist
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/kivio-ocr-helper-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/kivio-ocr-helper-x86_64-unknown-linux-gnu

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
