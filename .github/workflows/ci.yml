name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # typecheck 内串了 protocol:check(cargo run,见 package.json),
      # 因此前端检查也需要 Rust 工具链与 Tauri 系统库(glib-sys 等走 pkg-config)。
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri-build 的 build.rs 会校验 externalBin sidecar 与 frontendDist 存在性,
      # cargo run 不需要真产物,放空壳即可(与 rust-check.yml 相同处理)。
      - name: Stub sidecar binary and frontend dist
        run: |
          mkdir -p dist
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/kivio-ocr-helper-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/kivio-ocr-helper-x86_64-unknown-linux-gnu

      - name: Lint
        run: npm run lint

      # typecheck 本身就串了 protocol:check(见 package.json),生成物漂移在这一步拦住。
      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Build frontend
        run: npm run build:ui

      # RELEASE_PACKAGING.md 要求 package.json / package-lock.json / tauri.conf.json /
      # Cargo.toml 四处版本同步,这里在 CI 就拦住漂移,不用等发版时才发现。
      # (package-lock 与 package.json 不同步时 npm ci 本身也会失败)
      - name: Check version consistency
        run: |
          V_PKG="$(node -p "require('./package.json').version")"
          V_TAU="$(grep -oP '"version":\s*"\K[^"]+' src-tauri/tauri.conf.json | head -1)"
          V_CARGO="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          echo "package.json=$V_PKG tauri.conf.json=$V_TAU Cargo.toml=$V_CARGO"
          if [ "$V_PKG" != "$V_TAU" ] || [ "$V_PKG" != "$V_CARGO" ]; then
            echo "::error::版本号不一致: package.json=$V_PKG / tauri.conf.json=$V_TAU / Cargo.toml=$V_CARGO"
            exit 1
          fi

  # Rust/Tauri 侧门禁在 rust-check.yml(仅 src-tauri 变更时触发),与本文件职责分开。
